apiVersion: apps/v1
kind: Deployment
metadata:
  name: beannotifs
  namespace: phaseolus
  labels:
    app: beannotifs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: beannotifs
  template:
    metadata:
      labels:
        app: beannotifs
    spec:
      containers:
        - name: beannotifs
          image: beannotifs:dev # placeholder — bumped to a git-SHA tag once built and `minikube image load`ed (see architecture plan Q4)
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: RabbitMq__Host
              value: rabbitmq.infra.svc.cluster.local
            - name: RabbitMq__Port
              value: "5672"
            - name: RabbitMq__User
              value: phaseolus
            - name: RabbitMq__Pass
              value: phaseolus
            - name: Keycloak__Authority
              value: http://keycloak.infra.svc.cluster.local/realms/phaseolus
            - name: Keycloak__PublicAuthority
              value: http://localhost:8180/realms/phaseolus # browser-reachable via `kubectl port-forward svc/keycloak 8180:80`; update once a real ingress hostname exists
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: 8080
            initialDelaySeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: 8080
            initialDelaySeconds: 5
